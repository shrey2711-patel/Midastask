<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Modern Task / Laptop Icon -->
  <g transform="translate(106, 116)" filter="url(#glow)">
    <rect x="10" y="20" width="280" height="190" rx="20" fill="#1e293b" stroke="#475569" stroke-width="6"/>
    <rect x="35" y="45" width="230" height="140" rx="12" fill="#0f172a"/>
    <path d="M 0,225 L 300,225 L 280,245 L 20,245 Z" fill="#334155"/>
    <path d="M 120,225 L 180,225" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Checkmark inside screen -->
    <polyline points="75,115 125,160 225,75" fill="none" stroke="url(#checkGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

name = "midastask"
main = "worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "MIDAS_STATE", class_name = "MidasState" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MidasState"]

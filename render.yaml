services:
  - type: web
    name: officetask-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@officetask.com
      - key: ADMIN_PASSWORD
        sync: false # Set in Render Dashboard
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas M0 URI in Render Dashboard
      - key: CORS_ORIGIN
        value: "*"
